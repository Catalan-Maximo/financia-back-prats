# Perfil de desarrollo local (default).
# Credenciales desde .env local (ver .env.example).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
