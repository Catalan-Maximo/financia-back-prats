name: CI/CD — build, scan, push y deploy condicionado

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '¿Desplegar en Azure Container Apps?'
        type: boolean
        default: false

env:
  ACR_SERVER: crfinancia.azurecr.io
  IMAGE_NAME: financia-back

jobs:
  # ── CI: compila, testea, construye la imagen y la escanea con Grype ──────
  ci:
    name: CI — test + build + Grype + publicar
    runs-on: ubuntu-latest
    services:
      # PostgreSQL para el test contextLoads (usa la BD real)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/financia
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-solo-para-tests-1234567890abcdefghij
    steps:
      - uses: actions/checkout@v5

      # El SHA corto se calcula con sintaxis de shell y se publica como output.
      # En los bloques `with:` NO se expande ${...} — solo ${{ ... }}.
      - name: Calcular SHA corto
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B test

      - name: Construir imagen amd64 (etiquetas OCI con el SHA del commit)
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION=${{ steps.sha.outputs.short }} \
            --build-arg VCS_REF=${{ steps.sha.outputs.short }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }} .

      - name: Escanear vulnerabilidades con Grype (falla si hay CRÍTICAS)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          severity-cutoff: critical
          output-format: table

      # La imagen que CI construyó y escaneó es la MISMA que se publica.
      # Publicar ≠ desplegar: esto deja la versión en ACR sin tocar la app.
      - name: Login en Azure (Service Principal)
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publicar la imagen versionada en ACR (sin desplegar)
        run: |
          az acr login --name crfinancia
          docker push ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}

  # ── CD: publica en ACR y despliega — solo bajo condición explícita ───────
  cd:
    name: CD — push a ACR + deploy
    runs-on: ubuntu-latest
    needs: ci
    # CASO A (solo CI): push normal sin "[deploy]" en el mensaje del commit.
    # CASO B (CI + CD): commit con "[deploy]" en el mensaje.
    # CASO C (manual): workflow_dispatch marcando "deploy".
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    steps:
      - uses: actions/checkout@v5

      - name: Calcular SHA corto
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login en Azure con el Service Principal
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar la imagen publicada por CI en Container Apps
        run: |
          # No reconstruye ni republica: CI ya publicó la imagen escaneada con
          # este mismo tag (SHA del commit). El deploy solo apunta la app a ella.
          # Las variables de entorno y los secretos ya viven en la config de la
          # app (creados en F9) y persisten entre revisiones. El ambiente express
          # no acepta PATCH de secrets, por eso solo se cambia --image.
          az containerapp update -n financia-back -g rg-financia \
            --image ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}

      - name: Verificar que la app responda
        run: |
          URL=$(az containerapp show -n financia-back -g rg-financia \
                --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$URL/api/v1/health")
            [ "$CODE" = "200" ] && echo "✅ health OK en https://$URL" && exit 0
            sleep 10
          done
          echo "❌ la app no respondió" && exit 1
