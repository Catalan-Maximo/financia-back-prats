name: CI/CD — build, scan, push y deploy condicionado

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '¿Desplegar en Azure Container Apps?'
        type: boolean
        default: false

env:
  ACR_SERVER: crfinancia.azurecr.io
  IMAGE_NAME: financia-back

jobs:
  # ── CI: compila, testea, construye la imagen y la escanea con Grype ──────
  ci:
    name: CI — test + build + Grype
    runs-on: ubuntu-latest
    services:
      # PostgreSQL para el test contextLoads (usa la BD real)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/financia
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-solo-para-tests-1234567890abcdefghij
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B test

      - name: Construir imagen amd64 (etiquetas OCI con el SHA del commit)
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION=${GITHUB_SHA::7} \
            --build-arg VCS_REF=${GITHUB_SHA::7} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7} .

      - name: Escanear vulnerabilidades con Grype (falla si hay CRÍTICAS)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}
          severity-cutoff: critical
          output-format: table

  # ── CD: publica en ACR y despliega — solo bajo condición explícita ───────
  cd:
    name: CD — push a ACR + deploy
    runs-on: ubuntu-latest
    needs: ci
    # CASO A (solo CI): push normal sin "[deploy]" en el mensaje del commit.
    # CASO B (CI + CD): commit con "[deploy]" en el mensaje.
    # CASO C (manual): workflow_dispatch marcando "deploy".
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    steps:
      - uses: actions/checkout@v4

      - name: Login en Azure con el Service Principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Construir y publicar imagen versionada en ACR
        run: |
          az acr login --name crfinancia
          docker buildx build --platform linux/amd64 --push \
            --build-arg VERSION=${GITHUB_SHA::7} \
            --build-arg VCS_REF=${GITHUB_SHA::7} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7} .

      - name: Desplegar la nueva imagen en Container Apps
        run: |
          az containerapp update -n financia-back -g rg-financia \
            --image ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7} \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
              DB_USERNAME=financia \
              'DB_URL=jdbc:postgresql://financia-pg.postgres.database.azure.com:5432/financia?sslmode=require' \
              'DB_PASSWORD=secretref:db-pass' \
              'JWT_SECRET=secretref:jwt-secret' \
            --secret db-pass="${{ secrets.AZURE_DB_PASSWORD }}" \
                      jwt-secret="${{ secrets.AZURE_JWT_SECRET }}"

      - name: Verificar que la app responda
        run: |
          URL=$(az containerapp show -n financia-back -g rg-financia \
                --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://$URL/api/v1/health")
            [ "$CODE" = "200" ] && echo "✅ health OK en https://$URL" && exit 0
            sleep 10
          done
          echo "❌ la app no respondió" && exit 1
