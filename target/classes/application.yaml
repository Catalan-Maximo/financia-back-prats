spring:
  application:
    name: financia-api
  datasource:
    url: jdbc:postgresql://localhost:5432/financia
    username: postgres
    password: 21062004
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# IA de Groq — la API key va por variable de entorno GROQ_API_KEY.
# Si no está configurada, el asesor usa la lógica rule-based como fallback.
groq:
  api:
    base-url: https://api.groq.com/openai/v1
    key: ${GROQ_API_KEY:}
    model: openai/gpt-oss-120b

# JWT — la clave secreta va por variable de entorno JWT_SECRET
# (mínimo 32 caracteres). Sin ella, la app no arranca.
jwt:
  secret: ${JWT_SECRET:}
  expiracion-horas: 24
